<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Word 稿件格式规范化工具 V5.1 · 编辑安全版</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="wrap"><div class="card">
<h1>Word 稿件格式规范化工具 V5.1 · 编辑安全版</h1>
<p class="sub">原稿 DOCX → 确定性规范 → 结构完整性守卫 → 输出 DOCX 重新打开自检 → 人工确认。只改已经确认的期刊格式规则；图、表、公式、MathType/OLE、域、书签、媒体与关系文件都按受保护对象处理。</p>
<label class="drop" id="drop"><input id="file" type="file" accept=".docx"/><strong id="fileLabel">点击或拖入原版 .docx</strong><small>文件只在浏览器本地处理；结构自检失败时会直接阻止下载</small></label>
<div class="opts">
<label class="opt"><input id="optLayout" type="checkbox" checked><div><b>页面与正文基础版式</b><span>A4、上下 72 pt、左右 90 pt；10.5 pt 宋体；正文首行 2 字符、单倍行距、段前后 0</span></div></label>
<label class="opt"><input id="optFigures" type="checkbox" checked><div><b>图表安全修复</b><span>正文型图片保持原位置和尺寸；浮动图按图题/上下文安全归位；表格居中但不强制改单元格对齐</span></div></label>
<label class="opt"><input id="optPunct" type="checkbox" checked><div><b>符号、数字、单位与列表</b><span>中文双引号；150m→150 m；1234.1588→1 234.158 8；自动列表转纯文字；1）小标题与说明段合并。日期和普通数值范围连接符保持原文</span></div></label>
<label class="opt"><input id="optRefs" type="checkbox" checked><div><b>引文与参考文献规范</b><span>[1][2]→[1-2]；[1][10]→[1，10]；正文引文上标；参考文献条目转为普通文本“[1] 作者……”</span></div></label>
<label class="opt"><input id="optMarkup" type="checkbox" checked><div><b>校样标色</b><span>正文引文、正文“图 n/表 n”引用、图表题标黄；其余正文文字统一黑色</span></div></label>
</div>
<div class="actions"><button class="btn primary" id="run" disabled>分析并规范化</button><button class="btn primary" id="download" disabled>下载规范化 Word</button><button class="btn ghost" id="reset">重置</button></div>
<div class="status" id="status"></div>
<div class="log" id="log"><div class="grid" id="metrics"></div><div class="details" id="details"></div><div class="details changes" id="changes"></div></div>
<div class="audit" id="audit"><h2>需要你确认</h2><p class="auditSub">自动规则只处理已确认的格式。无法可靠替你判断的内容问题会列在这里，不会擅自写进正文。</p><div id="autoChecks" class="autoChecks"></div><div id="warnings" class="warnings"></div><div id="manual" class="manual"></div></div>
<div class="warn">V5.1 导出策略：先保留原 DOCX 包结构，再修改必要 OOXML；导出后重新解包并检查核心 XML、媒体、嵌入对象和关系文件。任何受保护结构减少或输出包自检失败，直接阻止下载。</div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="src/docx-core.js"></script>
<script src="src/format-rules.js"></script>
<script src="src/engine.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
