<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Word 稿件格式规范化工具 V5.4 · 编辑安全版</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#1f2937;background:#f5f7fb}
*{box-sizing:border-box} body{margin:0;padding:32px} .wrap{max-width:980px;margin:auto}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:26px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
h1{font-size:25px;margin:0 0 8px} .sub{color:#64748b;line-height:1.65;margin:0 0 22px}
.drop{border:2px dashed #94a3b8;border-radius:16px;padding:34px;text-align:center;cursor:pointer;background:#fafcff;transition:.15s}
.drop.drag{border-color:#111827;background:#f3f4f6}.drop strong{display:block;font-size:17px;margin-bottom:7px}.drop small{color:#64748b}
input[type=file]{display:none}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}
.opt{border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;background:#fff;display:flex;gap:9px;align-items:flex-start}.opt b{display:block;font-size:14px}.opt span{font-size:12px;color:#64748b;line-height:1.45}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 18px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff}.primary:disabled{opacity:.45;cursor:not-allowed}.ghost{background:#eef2f7;color:#111827}
.status{margin-top:18px;padding:14px 16px;border-radius:12px;background:#f8fafc;border:1px solid #e5e7eb;display:none}.status.show{display:block}.status.ok{background:#f0fdf4;border-color:#bbf7d0}.status.err{background:#fef2f2;border-color:#fecaca}
.log{margin-top:18px;border-top:1px solid #e5e7eb;padding-top:18px;display:none}.log.show{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f8fafc;border-radius:12px;padding:12px}.metric strong{font-size:20px;display:block}.metric span{font-size:12px;color:#64748b}
.details{margin-top:14px;max-height:260px;overflow:auto;border:1px solid #e5e7eb;border-radius:12px;padding:10px 14px;background:#fcfcfd;font-size:13px;line-height:1.7}.warn{margin-top:18px;color:#7c2d12;background:#fff7ed;border:1px solid #fed7aa;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.6}
.audit{display:none;margin-top:20px;border:1px solid #dbeafe;background:#f8fbff;border-radius:14px;padding:18px}.audit.show{display:block}.audit h2{font-size:18px;margin:0 0 4px}.auditSub{font-size:12px;color:#64748b;margin:0 0 12px}.autoChecks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.check{padding:9px 11px;border-radius:10px;font-size:13px;border:1px solid #e5e7eb;background:#fff}.check.ok{border-color:#bbf7d0;background:#f0fdf4}.check.bad{border-color:#fecaca;background:#fef2f2}.warnings{margin-top:12px}.issue{padding:10px 12px;margin:7px 0;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;font-size:13px;line-height:1.5}.manual{margin-top:14px;border-top:1px solid #dbeafe;padding-top:12px;display:grid;gap:8px}.manual label{font-size:13px;line-height:1.45;background:white;border:1px solid #e5e7eb;padding:9px 11px;border-radius:10px}.manual input{margin-right:7px}.btn:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:700px){body{padding:14px}.opts,.grid,.autoChecks{grid-template-columns:1fr}.card{padding:18px}}

.changes{margin-top:12px}.changes .chg{padding:7px 9px;border-left:3px solid #bcc6d3;margin:5px 0;background:#f8fafc}.changes .chg b{display:inline-block;min-width:150px}.changes .chg small{color:#667085}.guard{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;margin-top:6px}.guard.bad{color:#b42318}.guard.ok{color:#067647}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>Word 稿件格式规范化工具 V5.4 · 编辑安全版</h1>
<p class="sub">内部已重构为“文档模型 → 分阶段规则引擎 → 完整性守卫 → 质检引擎 → 输出”的结构。使用方式不变：只自动执行确定性格式规则，不擅自改论文数据；处理后给出变更记录、完整性检查和人工确认清单。文件只在浏览器本地处理。</p>
<label class="drop" id="drop"><input id="file" type="file" accept=".docx"/><strong id="fileLabel">点击或拖入原版 .docx</strong><small>只支持 DOCX；不会自动改写论文观点或英文摘要内容</small></label>
<div class="opts">
<label class="opt"><input id="optLayout" type="checkbox" checked><div><b>页面与正文基础版式</b><span>A4、上下 72 pt、左右 90 pt；10.5 pt 宋体；正文首行 2 字符、单倍行距、段前后 0</span></div></label>
<label class="opt"><input id="optFigures" type="checkbox" checked><div><b>图表安全修复</b><span>正文型图片保持原位置和尺寸；浮动图优先按已有图题归位；表格居中但不强制改单元格对齐</span></div></label>
<label class="opt"><input id="optPunct" type="checkbox" checked><div><b>符号、数字与列表</b><span>比例号、1）式列表、标题双空格、关键词及中英文标签；日期/普通数值范围保持原文</span></div></label>
<label class="opt"><input id="optRefs" type="checkbox" checked><div><b>引文规范</b><span>[n] 上标；连续/非连续引文分组：[3][4]→[3-4]；[1][10]→[1，10]；REF 交叉引用域转普通文字；公式域继续保护</span></div></label>
<label class="opt"><input id="optMarkup" type="checkbox" checked><div><b>正确稿校样标色</b><span>正文引文、正文“图 n/表 n”引用、图表题标黄；其他正文文字统一黑色</span></div></label>
</div>
<div class="actions"><button class="btn primary" id="run" disabled>分析并规范化</button><button class="btn primary" id="download" disabled>下载规范化 Word</button><button class="btn ghost" id="reset">重置</button></div>
<div class="status" id="status"></div><div class="log" id="log"><div class="grid" id="metrics"></div><div class="details" id="details"></div><div class="details changes" id="changes"></div></div><div class="audit" id="audit"><h2>需要你确认</h2><p class="auditSub">这里专门列出机器不应该替你拍板的项目。黄色标记用于校样，不代表错误。</p><div id="autoChecks" class="autoChecks"></div><div id="warnings" class="warnings"></div><div id="manual" class="manual"></div></div>
<div class="warn">V5.4 规则边界：不自动改普通数值范围、日期连接符、单位数值或参考文献页码范围；不把正文缺失的“如图 n 所示”直接写进稿件，而是在审核清单里提醒你。连续引文、红字、固定标题、作者简介对齐等确定规则直接处理。</div>
</div></div>

class ChangeRecorder{
  constructor(){this.items=[]}
  record(ruleId,label,before,after,note=''){
    const delta={};
    for(const k of Object.keys(after)) if(typeof after[k]==='number'&&after[k]!==before[k]) delta[k]=after[k]-before[k];
    this.items.push({ruleId,label,delta,note});

}

class DocumentSnapshot{
  static take(body){
    const count=(ns,name)=>body.getElementsByTagNameNS(ns,name).length;
    return {
      paragraphs:count(W,'p'), tables:count(W,'tbl'), drawings:count(W,'drawing'),
      math:count(M,'oMath')+count(M,'oMathPara'), objects:count(W,'object'), pict:count(W,'pict'),
      hyperlinks:count(W,'hyperlink'), bookmarks:count(W,'bookmarkStart'), fields:count(W,'fldChar'), instrText:count(W,'instrText'), refFields:countRefInstructions(body), otherFields:countOtherFieldInstructions(body)
    };
  }
}
class PackageSnapshot{
  static take(zip){
    const names=Object.keys(zip.files).filter(n=>!zip.files[n].dir).sort();
    const pick=prefix=>names.filter(n=>n.startsWith(prefix));
    return {files:names.length,media:pick('word/media/'),embeddings:pick('word/embeddings/'),rels:names.filter(n=>n.endsWith('.rels')).sort()};
  }
}

class IntegrityGuard{
  static compare(before,after){
    const warnings=[],ok=[];

    for(const k of protectedKeys){

  }
}
function sameArray(a,b){return a.length===b.length&&a.every((x,i)=>x===b[i])}

class DocxContext{
  constructor(file,options,zip,doc,body){

}

class RuleEngine{
  constructor(rules){this.rules=rules}
  async run(ctx){
    for(const phase of ['package','structure','placement','format','post']){
      for(const rule of this.rules.filter(r=>r.phase===phase)){
        if(rule.enabled&&!rule.enabled(ctx))continue;
        const before=ctx.snapshotStats();await rule.apply(ctx);ctx.changes.record(rule.id,rule.label,before,ctx.snapshotStats(),rule.note||'');
      }
    }
  }
}

  run(ctx){

const RULES=[

async function loadDocx(file,options){
  const zip=await JSZip.loadAsync(await file.arrayBuffer());const f=zip.file('word/document.xml');if(!f)throw new Error('这不是有效 DOCX：缺少 word/document.xml');
  const xml=await f.async('string'),doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.getElementsByTagName('parsererror')[0])throw new Error('Word XML 解析失败');

}
async function processDocx(file,options){

  if(options.refs&&audit.remainingRefFields)throw new Error(`REF 域清理失败：仍残留 ${audit.remainingRefFields} 个交叉引用域，已阻止导出。`);
  if(audit.integrity.warnings.length)throw new Error('完整性守卫发现受保护 Word 对象数量减少，已阻止导出：'+audit.integrity.warnings.join('；'));
  ctx.zip.file('word/document.xml',new XMLSerializer().serializeToString(ctx.doc));
  const blob=await ctx.zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',compression:'DEFLATE'});
  audit.outputValidation=await validateGeneratedDocx(blob,ctx.packageBefore);
  if(!audit.outputValidation.ok)throw new Error('输出 DOCX 自检失败，已阻止下载：'+audit.outputValidation.errors.join('；'));

class UIController{
  constructor(){this.selectedFile=null;this.lastResult=null;this.lastUrl=null;this.fileInput=$('file');this.drop=$('drop');this.runBtn=$('run');this.bind()}
  bind(){
    this.drop.onclick=e=>{if(e.target!==this.fileInput)this.fileInput.click()};this.fileInput.onchange=()=>this.pick(this.fileInput.files[0]);
    for(const ev of ['dragenter','dragover'])this.drop.addEventListener(ev,e=>{e.preventDefault();this.drop.classList.add('drag')});
    for(const ev of ['dragleave','drop'])this.drop.addEventListener(ev,e=>{e.preventDefault();this.drop.classList.remove('drag')});
    this.drop.addEventListener('drop',e=>this.pick(e.dataTransfer.files[0]));$('reset').onclick=()=>this.reset();this.runBtn.onclick=()=>this.run();$('download').onclick=()=>this.download();
  }

  pick(f){if(!f)return;if(!/\.docx$/i.test(f.name)){this.showStatus('只支持 .docx 文件。','err');return}this.selectedFile=f;this.lastResult=null;if(this.lastUrl){URL.revokeObjectURL(this.lastUrl);this.lastUrl=null}$('download').disabled=true;$('fileLabel').textContent=f.name;this.runBtn.disabled=false;this.showStatus('已载入：'+f.name,'')}
  options(){return{layout:$('optLayout').checked,figures:$('optFigures').checked,punct:$('optPunct').checked,refs:$('optRefs').checked,markup:$('optMarkup').checked}}
  async run(){
    if(!this.selectedFile)return;this.runBtn.disabled=true;$('download').disabled=true;this.showStatus('V5.4 正在处理，并执行 REF 域清理、OOXML 结构与输出包双重自检……','');$('log').className='log';$('audit').className='audit';
    try{
      const out=await processDocx(this.selectedFile,this.options());this.lastResult=out;if(this.lastUrl)URL.revokeObjectURL(this.lastUrl);this.lastUrl=URL.createObjectURL(out.blob);

}

  const warnings=[];
  if(a.missingFig.length)warnings.push(`有图题但正文没有出现对应图号：${numsText(a.missingFig,'图')}。请确认是否需要补“如图 n 所示/见图 n”。`);

  if(a.unitSpacingIssues.length)warnings.push(`仍发现疑似数字与单位未空格：${a.unitSpacingIssues.join('；')}`);
  if(a.asciiChineseQuotes.length)warnings.push(`仍发现中文语境中的英文直双引号：${a.asciiChineseQuotes.join('；')}`);
  if(a.remainingRefFields)warnings.push(`仍残留 ${a.remainingRefFields} 个 REF 交叉引用域，需停止使用该输出。`);
  for(const w of a.integrity.warnings)warnings.push(`结构完整性守卫：${w}`);if(a.outputValidation&&!a.outputValidation.ok)for(const w of a.outputValidation.errors)warnings.push(`输出 DOCX 自检：${w}`);
  const packageOK=a.outputValidation&&a.outputValidation.ok;
  $('audit').className='audit show';
  $('autoChecks').innerHTML=`<div class="check ${a.integrity.warnings.length?'bad':'ok'}">${a.integrity.warnings.length?'!':'✓'} OOXML 受保护对象数量检查</div><div class="guard ${a.integrity.warnings.length?'bad':'ok'}">${a.integrity.warnings.length?a.integrity.warnings.join('<br>'):'受保护对象数量未减少：'+a.integrity.ok.join('；')}</div><div class="check ${packageOK?'ok':'bad'}">${packageOK?'✓':'!'} 输出 DOCX 重新打开与媒体/嵌入对象/关系文件自检</div><div class="guard ${packageOK?'ok':'bad'}">${packageOK?a.outputValidation.checks.join('；'):(a.outputValidation?a.outputValidation.errors.join('；'):'未执行')}</div><div class="check ${a.redRemaining===0?'ok':'bad'}">${a.redRemaining===0?'✓':'!'} 红色/彩色正文清理</div><div class="check ${a.datePreserved?'ok':'bad'}">${a.datePreserved?'✓':'!'} 收稿日期完全保留</div><div class="check ${a.refHeadOK&&a.refHeadBold?'ok':'bad'}">${a.refHeadOK&&a.refHeadBold?'✓':'!'} “参考文献：”固定标题且加粗</div><div class="check ${a.remainingRefFields===0?'ok':'bad'}">${a.remainingRefFields===0?'✓':'!'} REF 交叉引用域已全部转为普通文字</div><div class="check ${a.decoratedReferencePrefixes===0?'ok':'bad'}">${a.decoratedReferencePrefixes===0?'✓':'!'} 参考文献条目编号为普通基线文字（不标黄、不上标）</div><div class="check ${a.remainingNumPr===0?'ok':'bad'}">${a.remainingNumPr===0?'✓':'!'} 正文自动列表已转纯文字</div><div class="check ${a.unitSpacingIssues.length===0?'ok':'bad'}">${a.unitSpacingIssues.length===0?'✓':'!'} 数字与单位空格检查</div><div class="check ${a.asciiChineseQuotes.length===0?'ok':'bad'}">${a.asciiChineseQuotes.length===0?'✓':'!'} 中文双引号检查</div>`;
  $('warnings').innerHTML=warnings.length?warnings.map(x=>`<div class="issue">⚠ ${x}</div>`).join(''):'<div class="check ok">✓ 当前自动检查未发现明显异常。</div>';
  $('manual').innerHTML=`<label><input type="checkbox"> 我已核对“图 n/表 n”正文引用是否需要补写</label><label><input type="checkbox"> 我已核对图号、表号与实际图表顺序</label><label><input type="checkbox"> 我已核对公式、数值范围与特殊单位表达（数值范围本身不自动改连接符）</label><label><input type="checkbox"> 我已核对参考文献内容、作者简介内容和文中技术数据</label>`;
}
new UIController();

</script></body></html>
